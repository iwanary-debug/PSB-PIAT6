<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSB PIAT 6 Bondowoso - Project Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getStorage } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForPreviewModeOnly12345",
            authDomain: "piat6-psb.firebaseapp.com",
            projectId: "piat6-psb",
            storageBucket: "piat6-psb.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456:web:123456"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('mainAppContainer').classList.remove('hidden');
                document.getElementById('currentUserNameLabel').innerText = user.email;
            } else {
                document.getElementById('authContainer').classList.remove('hidden');
                document.getElementById('mainAppContainer').classList.add('hidden');
            }
        });

        // ============ FUNGSI YANG DITAMBAHKAN ============
        window.switchLoginTab = function(tab) {
            if(tab === 'admin') {
                document.getElementById('adminLoginForm').classList.remove('hidden');
                document.getElementById('userLoginForm').classList.add('hidden');
                document.getElementById('tabAdminBtn').classList.add('bg-white', 'text-emerald-700', 'shadow-sm');
                document.getElementById('tabUserBtn').classList.remove('bg-white', 'text-emerald-700', 'shadow-sm');
            } else {
                document.getElementById('userLoginForm').classList.remove('hidden');
                document.getElementById('adminLoginForm').classList.add('hidden');
                document.getElementById('tabUserBtn').classList.add('bg-white', 'text-emerald-700', 'shadow-sm');
                document.getElementById('tabAdminBtn').classList.remove('bg-white', 'text-emerald-700', 'shadow-sm');
            }
        }

        window.handleAdminLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                showModal('Sukses', 'Login Berhasil', 'Selamat datang Panitia PSB PIAT 6');
            } catch (error) {
                showModal('Error', 'Login Gagal', error.message);
            }
        }

        window.handleUserLogin = function(e) {
            e.preventDefault();
            showModal('Info', 'Portal Santri', 'Fitur login santri akan diaktifkan setelah data terintegrasi');
        }

        window.logout = async function() {
            await signOut(auth);
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('section[id^="view-"]').forEach(s => s.classList.add('hidden'));
            document.getElementById('view-' + tab).classList.remove('hidden');
            document.querySelectorAll('aside button').forEach(b => b.classList.remove('bg-emerald-50', 'text-emerald-700'));
            document.getElementById('nav-' + tab).classList.add('bg-emerald-50', 'text-emerald-700');
        }

        window.showModal = function(title, message, extra='') {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.remove('hidden');
        }
        window.closeModal = function() {
            document.getElementById('customModal').classList.add('hidden');
        }
        // ============ AKHIR FUNGSI ============

    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 mx-4">
            <h3 id="modalTitle" class="text-lg font-bold text-slate-900">Notifikasi</h3>
            <p id="modalMessage" class="text-slate-600 text-sm my-4">Pesan</p>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl">Mengerti</button>
            </div>
        </div>
    </div>

    <div id="authContainer" class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-emerald-900 via-emerald-800 to-slate-900">
        <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl w-full max-w-md p-8">
            <h1 class="text-2xl font-bold text-center mb-8">PSB PIAT 6 Bondowoso</h1>
            <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-6">
                <button onclick="switchLoginTab('admin')" id="tabAdminBtn" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-white text-emerald-700 shadow-sm">Panitia / Admin</button>
                <button onclick="switchLoginTab('user')" id="tabUserBtn" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-500">Calon Santri</button>
            </div>
            <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-4">
                <input type="email" id="adminEmail" required placeholder="panitia@piat6bondowoso.sch.id" class="w-full p-3 bg-slate-50 border rounded-xl text-sm">
                <input type="password" id="adminPassword" required placeholder="••••••••" class="w-full p-3 bg-slate-50 border rounded-xl text-sm">
                <button type="submit" class="w-full py-3.5 bg-emerald-600 text-white font-bold rounded-xl">Masuk sebagai Panitia</button>
            </form>
            <form id="userLoginForm" onsubmit="handleUserLogin(event)" class="space-y-4 hidden">
                <input type="text" id="userUsername" required placeholder="PSB2026001" class="w-full p-3 bg-slate-50 border rounded-xl text-sm">
                <input type="password" id="userPassword" required placeholder="••••••••" class="w-full p-3 bg-slate-50 border rounded-xl text-sm">
                <button type="submit" class="w-full py-3.5 bg-emerald-600 text-white font-bold rounded-xl">Masuk Portal Pendaftar</button>
            </form>
        </div>
    </div>

    <div id="mainAppContainer" class="flex-1 flex-col hidden">
        <header class="bg-white border-b p-4 flex justify-between">
            <h2 class="font-bold">Panel Administrator</h2>
            <button onclick="logout()" class="text-rose-600 font-semibold">Keluar</button>
        </header>
        <main class="flex-1 p-8">
            <h1 class="text-xl font-bold">Dashboard Utama PSB</h1>
        </main>
    </div>

</body>
</html>
